version: '3.9'

networks:
  default:
    driver: bridge

services:
  rendering:
    build:
      context: .
      dockerfile: environment/dev/Dockerfile
    env_file:
      - .env.dev
    volumes:
      - ./:/app
    ports:
      - "${HTTP_PORT}:${HTTP_PORT}"
      - "2346:2346"
    networks:
      - default
    restart: unless-stopped